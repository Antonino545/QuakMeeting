name: Build & Release Multiplatform QuakMeeting

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-EventKit pyobjc-framework-Quartz

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Build macOS App & DMG
        run: |
          bash scripts/build_macos_dmg.sh

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuakMeeting-macOS-DMG
          path: QuakMeeting-macOS.dmg

  build-ubuntu:
    name: Build Ubuntu DEB
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Wayland & GTK Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-appindicator3-0.1 gir1.2-gtklayershell-0.1 libgtk-3-dev dpkg-dev

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover -s tests -v

      - name: Build Debian Package
        run: |
          bash scripts/build_ubuntu_deb.sh

      - name: Upload Ubuntu DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuakMeeting-Ubuntu-DEB
          path: deb_dist/*.deb

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-ubuntu]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: QuakMeeting-macOS-DMG
          path: release_assets/

      - name: Download Ubuntu Artifact
        uses: actions/download-artifact@v4
        with:
          name: QuakMeeting-Ubuntu-DEB
          path: release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
