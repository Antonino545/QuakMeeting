name: CI Test & Build

on:
  push:
    branches:
      - test
      - 'feature/**'
  pull_request:
    branches:
      - main
      - test
  workflow_dispatch:

jobs:
  test-macos:
    name: Test & Build macOS (CI)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-EventKit pyobjc-framework-Quartz

      - name: Run Linter & Unit Tests
        run: |
          ruff check .
          python3 -m unittest discover -s tests -v

      - name: Build macOS App & DMG
        run: |
          bash scripts/build_macos_dmg.sh

      - name: Upload Test macOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Test-QuakMeeting-macOS-DMG
          path: QuakMeeting-macOS.dmg
          retention-days: 7

  test-ubuntu:
    name: Test & Build Ubuntu (CI)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-pyqt6 gir1.2-edataserver-1.2 gir1.2-ecal-2.0 dpkg-dev

      - name: Run Linter & Unit Tests
        run: |
          python3 -m pip install --upgrade pip
          pip install ruff PyQt6
          ruff check .
          python3 -m unittest discover -s tests -v

      - name: Build Debian Package
        run: |
          bash scripts/build_ubuntu_deb.sh

      - name: Upload Test Ubuntu Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Test-QuakMeeting-Ubuntu-DEB
          path: deb_dist/*.deb
          retention-days: 7
