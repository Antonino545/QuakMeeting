app-id: com.quakmeeting.QuakMeeting
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: quakmeeting

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.StatusNotifierItem-*
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-config/quakmeeting:create
  - --filesystem=~/.quakmeeting:create

modules:
  - name: python3-dependencies
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} requests urllib3 PyQt6 || pip3 install --prefix=${FLATPAK_DEST} requests urllib3 PyQt6

  - name: quakmeeting
    buildsystem: simple
    build-commands:
      # Install payload into /app/share/quakmeeting
      - install -d /app/share/quakmeeting
      - cp -r core /app/share/quakmeeting/
      - cp -r ui /app/share/quakmeeting/
      # Isolate Linux UI: strip macOS AppKit/Quartz files from flatpak bundle
      - rm -rf /app/share/quakmeeting/ui/macos
      - find /app/share/quakmeeting -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      - cp -r assets /app/share/quakmeeting/
      - cp main.py /app/share/quakmeeting/

      # Install desktop integration and metainfo
      - install -D -m 644 packaging/flatpak/com.quakmeeting.QuakMeeting.desktop /app/share/applications/com.quakmeeting.QuakMeeting.desktop
      - install -D -m 644 packaging/flatpak/com.quakmeeting.QuakMeeting.metainfo.xml /app/share/metainfo/com.quakmeeting.QuakMeeting.metainfo.xml
      - install -D -m 644 assets/icon.png /app/share/icons/hicolor/512x512/apps/com.quakmeeting.QuakMeeting.png

      # Create launcher script
      - install -d /app/bin
      - |
        cat << 'WRAPPER_EOF' > /app/bin/quakmeeting
        #!/bin/bash
        export PYTHONUNBUFFERED=1
        exec python3 /app/share/quakmeeting/main.py "$@"
        WRAPPER_EOF
      - chmod +x /app/bin/quakmeeting
    sources:
      - type: dir
        path: ../..
